[platformio]
default_envs = integrated
src_dir = .

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
 bblanchon/ArduinoJson@7.3.1
 adafruit/Adafruit MPU6050@2.2.6
 adafruit/Adafruit ADS1X15@2.5.0
 mikalhart/TinyGPSPlus@1.1.0
 plerup/EspSoftwareSerial@8.2.0

[env:integrated]
build_src_filter = +<src/main.cpp>

[env:compile_all_only]
build_src_filter = +<src/main.cpp>
build_flags = -DSOLAIR_COMPILE_ALL=1

[env:00_esp32_boot_and_status_led]
build_src_filter = +<tests/00_esp32_boot_and_status_led/entry.cpp>

[env:01_i2c_mpu6050]
build_src_filter = +<tests/01_i2c_mpu6050/entry.cpp>

[env:01a_imu_wire_crosscheck]
build_src_filter = +<tests/01a_imu_wire_crosscheck/entry.cpp>

[env:02_tamper_switches]
build_src_filter = +<tests/02_tamper_switches/entry.cpp>

[env:03_mosfet_logic_led_first]
build_src_filter = +<tests/03_mosfet_logic_led_first/entry.cpp>

[env:04_12v_alarm_fused]
build_src_filter = +<tests/04_12v_alarm_fused/entry.cpp>

[env:05_ads1115]
build_src_filter = +<tests/05_ads1115/entry.cpp>

[env:05a_ads_register_crosscheck]
build_src_filter = +<tests/05a_ads_register_crosscheck/entry.cpp>

[env:06_acs758]
build_src_filter = +<tests/06_acs758/entry.cpp>

[env:06a_adc_wire_crosscheck]
build_src_filter = +<tests/06a_adc_wire_crosscheck/entry.cpp>
lib_deps =

[env:07_gps_neo6m]
build_src_filter = +<tests/07_gps_neo6m/entry.cpp>

[env:08b_a7670e_esp_uart]
build_src_filter = +<tests/08b_a7670e_esp_uart/entry.cpp>

[env:09b_pzem_esp32_max3485]
build_src_filter = +<tests/09b_pzem_esp32_max3485/entry.cpp>

[env:10_wifi_authenticated_ingest]
build_src_filter = +<tests/10_wifi_authenticated_ingest/entry.cpp>

[env:11_combined_all_sensors_soak]
build_src_filter = +<tests/11_combined_all_sensors_soak/entry.cpp>
