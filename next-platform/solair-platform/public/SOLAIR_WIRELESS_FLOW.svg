<svg xmlns="http://www.w3.org/2000/svg" class="flow" viewBox="0 0 1440 330" role="img" aria-label="Device LTE upload to laptop backend, then phone HTTPS polling"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#800000"/></marker></defs><rect x="12" y="78" width="256" height="116" rx="10" fill="#fff9e9" stroke="#800000" stroke-width="3"/><text x="140" y="121" font-family="Arial" font-size="23" font-weight="bold" text-anchor="middle" fill="#182534">ESP32</text><text x="140" y="160" font-family="Arial" font-size="20" text-anchor="middle" fill="#182534">Sensors + local FSM</text><path d="M268 136H295" stroke="#800000" stroke-width="3" marker-end="url(#arrow)"/><rect x="300" y="78" width="256" height="116" rx="10" fill="#fff9e9" stroke="#800000" stroke-width="3"/><text x="428" y="121" font-family="Arial" font-size="23" font-weight="bold" text-anchor="middle" fill="#182534">SIMCom A7670E</text><text x="428" y="160" font-family="Arial" font-size="20" text-anchor="middle" fill="#182534">UART / PPP / LTE</text><path d="M556 136H583" stroke="#800000" stroke-width="3" marker-end="url(#arrow)"/><rect x="588" y="78" width="256" height="116" rx="10" fill="#fff9e9" stroke="#800000" stroke-width="3"/><text x="716" y="121" font-family="Arial" font-size="23" font-weight="bold" text-anchor="middle" fill="#182534">HTTPS ingestion</text><text x="716" y="160" font-family="Arial" font-size="20" text-anchor="middle" fill="#182534">Device tunnel</text><path d="M844 136H871" stroke="#800000" stroke-width="3" marker-end="url(#arrow)"/><rect x="876" y="78" width="256" height="116" rx="10" fill="#fff9e9" stroke="#800000" stroke-width="3"/><text x="1004" y="121" font-family="Arial" font-size="23" font-weight="bold" text-anchor="middle" fill="#182534">Laptop backend</text><text x="1004" y="160" font-family="Arial" font-size="20" text-anchor="middle" fill="#182534">Express + SQLite</text><path d="M1132 136H1159" stroke="#800000" stroke-width="3" marker-end="url(#arrow)"/><rect x="1164" y="78" width="256" height="116" rx="10" fill="#fff9e9" stroke="#800000" stroke-width="3"/><text x="1292" y="121" font-family="Arial" font-size="23" font-weight="bold" text-anchor="middle" fill="#182534">Phone web app</text><text x="1292" y="160" font-family="Arial" font-size="20" text-anchor="middle" fill="#182534">HTTPS · 5 s polling</text><text x="720" y="250" text-anchor="middle" font-family="Arial" font-size="20" fill="#182534">Device upload and phone viewing use separate HTTPS tunnels to the same laptop-hosted system.</text><text x="720" y="290" text-anchor="middle" font-family="Arial" font-size="20" fill="#182534">Control return: phone → backend queue → next LTE HTTPS response → ESP32 → device result in telemetry.</text></svg>